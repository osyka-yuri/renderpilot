name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # Ensures that an in-flight publish operation is never aborted by subsequent commits.

permissions:
  contents: read

jobs:
  # Gate the release on the same quality checks utilized in the CI pipeline, targeting the deployment platform.
  quality:
    name: Quality gates
    uses: ./.github/workflows/quality.yml
    with:
      rust-os: '["windows-latest"]'

  release:
    name: Build and publish
    needs: quality
    environment:
      name: release-publication
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: apps/desktop/package.json

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      # Install the Rust toolchain as specified in `rust-toolchain.toml`.
      - name: Install Rust toolchain
        run: rustup show

      - name: Read release context
        id: release_context
        shell: pwsh
        env:
          RENDERPILOT_RAW_REF_NAME: ${{ github.ref_name }}
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $package = $metadata.packages |
            Where-Object { $_.name -eq "renderpilot-desktop" } |
            Select-Object -First 1
          if (-not $package) {
            throw "Could not find the renderpilot-desktop package in Cargo metadata."
          }

          $version = $package.version
          $expectedTag = "v$version"
          $actualTag = $env:RENDERPILOT_RAW_REF_NAME
          if ($actualTag -cne $expectedTag) {
            throw "Release tag $actualTag does not match Cargo version $expectedTag."
          }

          $targetCommit = git rev-parse --verify --end-of-options "$actualTag^{}"
          if ($LASTEXITCODE -ne 0 -or $targetCommit -notmatch '^[0-9a-f]{40}$') {
            throw "Could not resolve release tag $actualTag to its target commit."
          }
          $publishedAt = git show -s --format=%cI $targetCommit
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($publishedAt)) {
            throw "Could not read the stable release-tag commit timestamp."
          }

          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "(?s)## \[$version\].*?(?=(?:`r?`n## \[)|$)"
          if ($changelog -match $pattern) {
            $body = $matches[0].Trim()
          } else {
            $body = "See the assets to download this version and install."
          }
          $changelogPath = Join-Path $env:RUNNER_TEMP "renderpilot-release-changelog.md"
          [IO.File]::WriteAllText($changelogPath, $body, [Text.UTF8Encoding]::new($false))

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$actualTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "commit=$targetCommit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "published_at=$publishedAt" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "changelog_path=$changelogPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # tauri-action is deliberately limited to signing/building this run's
      # artifacts. All GitHub release mutation is create-only below.
      - name: Build signed installer artifacts
        id: tauri_build
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          RENDERPILOT_WINDOWS_MANIFEST: production
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          uploadUpdaterJson: false

      - name: Verify standard App Windows manifest
        shell: pwsh
        run: |
          ./apps/desktop/scripts/verify-windows-manifest.ps1 `
            -Path (Join-Path $env:GITHUB_WORKSPACE "target\release\renderpilot-desktop.exe") `
            -ExpectedExecutionLevel requireAdministrator

      # The release builder produces the non-runnable signed RPU, embeds those
      # exact public bytes in the stable raw supervisor SFX, signs the raw
      # manual artifact, and packages its byte-identical ZIP entry.
      - name: Build and validate portable RPU and raw supervisor artifacts
        shell: pwsh
        env:
          RENDERPILOT_RELEASE_VERSION: ${{ steps.release_context.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          ./apps/desktop/scripts/release-portable-artifacts.ps1 `
            -Version $env:RENDERPILOT_RELEASE_VERSION

      - name: Publish and verify release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENDERPILOT_TAURI_ARTIFACT_PATHS: ${{ steps.tauri_build.outputs.artifactPaths }}
          RENDERPILOT_RELEASE_VERSION: ${{ steps.release_context.outputs.version }}
          RENDERPILOT_RELEASE_TAG: ${{ steps.release_context.outputs.tag }}
          RENDERPILOT_RELEASE_REPOSITORY: ${{ github.repository }}
          RENDERPILOT_RELEASE_COMMIT: ${{ steps.release_context.outputs.commit }}
          RENDERPILOT_RELEASE_EVENT_SHA: ${{ github.sha }}
          RENDERPILOT_RELEASE_RUN_ID: ${{ github.run_id }}
          RENDERPILOT_RELEASE_PUBLISHED_AT: ${{ steps.release_context.outputs.published_at }}
          RENDERPILOT_RELEASE_CHANGELOG_PATH: ${{ steps.release_context.outputs.changelog_path }}
        run: |
          ./apps/desktop/scripts/publish-release-assets.ps1 `
            -Version $env:RENDERPILOT_RELEASE_VERSION `
            -Tag $env:RENDERPILOT_RELEASE_TAG `
            -Repository $env:RENDERPILOT_RELEASE_REPOSITORY `
            -Commit $env:RENDERPILOT_RELEASE_COMMIT `
            -GitHubSha $env:RENDERPILOT_RELEASE_EVENT_SHA `
            -RunId $env:RENDERPILOT_RELEASE_RUN_ID `
            -PublishedAt $env:RENDERPILOT_RELEASE_PUBLISHED_AT `
            -ChangelogPath $env:RENDERPILOT_RELEASE_CHANGELOG_PATH `
            -TauriArtifactPathsJson $env:RENDERPILOT_TAURI_ARTIFACT_PATHS
