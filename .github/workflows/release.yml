name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # Ensures that an in-flight publish operation is never aborted by subsequent commits.

permissions:
  contents: read

jobs:
  # Gate the release on the same quality checks utilized in the CI pipeline, targeting the deployment platform.
  quality:
    name: Quality gates
    uses: ./.github/workflows/quality.yml
    with:
      rust-os: '["windows-latest"]'

  release:
    name: Build and publish
    needs: quality
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: apps/desktop/package.json

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      # Install the Rust toolchain as specified in `rust-toolchain.toml`.
      - name: Install Rust toolchain
        run: rustup show

      - name: Read and validate app version
        id: version
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $package = $metadata.packages |
            Where-Object { $_.name -eq "renderpilot-desktop" } |
            Select-Object -First 1
          if (-not $package) {
            throw "Could not find the renderpilot-desktop package in Cargo metadata."
          }

          $version = $package.version
          $expectedTag = "v$version"
          $actualTag = "${{ github.ref_name }}"
          if ($actualTag -ne $expectedTag) {
            throw "Release tag $actualTag does not match Cargo version $expectedTag."
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # Note: `tauri-action` executes the frontend build via its `beforeBuildCommand`.
      - name: Extract Changelog
        id: changelog
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "(?s)## \[$version\].*?(?=(?:`r?`n## \[)|$)"
          if ($changelog -match $pattern) {
            $body = $matches[0].Trim()
          } else {
            $body = "See the assets to download this version and install."
          }
          "body<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build and create release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: "RenderPilot v__VERSION__"
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: true
          prerelease: false

      # Build the portable exe via the Tauri CLI so that TAURI_ENV_DEBUG and
      # other required env vars are set correctly — plain `cargo build` skips
      # this and leaves Tauri in dev mode, causing "page not found" at runtime.
      # The config is written to a file first to avoid PowerShell stripping
      # double quotes when passing inline JSON through pnpm to the Tauri CLI.
      - name: Build portable exe
        working-directory: apps/desktop
        shell: pwsh
        run: |
          '{"bundle":{"active":false}}' | Set-Content -Path portable-config.json -Encoding utf8
          pnpm tauri build --features portable --config portable-config.json
          Remove-Item portable-config.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path RenderPilot
          Copy-Item target\release\renderpilot-desktop.exe RenderPilot\renderpilot-desktop.exe
          Compress-Archive -Path RenderPilot -DestinationPath "RenderPilot-${{ steps.version.outputs.version }}-portable.zip"

      - name: Upload portable zip to release
        run: gh release upload ${{ github.ref_name }} "RenderPilot-${{ steps.version.outputs.version }}-portable.zip" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
