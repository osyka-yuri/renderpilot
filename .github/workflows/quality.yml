name: Quality gates

# Reusable workflow serving as the single source of truth for RenderPilot's quality gates.
# It is invoked by both `ci.yml` (Ubuntu and Windows) and `release.yml` (Windows only)
# to ensure the quality checks guarding the `main` branch and releases remain synchronized.
on:
  workflow_call:
    inputs:
      rust-os:
        description: JSON array of runner OSes for the Rust matrix.
        type: string
        default: '["ubuntu-latest", "windows-latest"]'
permissions:
  contents: read

env:
  RENDERPILOT_LIBRARIES_CONTRACT_REF: 4aa1696a921e19eb9491119d2ad01d57626f437d
  CARGO_TERM_COLOR: always
  # Deny rustc warnings for workspace packages (Cargo 1.97+). Prefer this over
  # RUSTFLAGS=-Dwarnings so the build cache is not thrash-invalidated.
  # Note (Cargo #17142): build.warnings=deny elevates informational MSVC
  # linker_messages even though rustc's `warnings` group does not include them.
  # Windows build/test steps override this one Cargo policy knob; Clippy still
  # denies Rust warnings for every target on both matrix platforms.
  CARGO_BUILD_WARNINGS: deny

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.rust-os) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Tauri's Linux build requires WebKitGTK and other dependencies. On Windows, WebView2 is utilized natively.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config

      # Installs the toolchain, rustfmt, and clippy as specified in `rust-toolchain.toml`.
      - name: Install Rust toolchain
        run: rustup show

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.os }}

      # Code formatting is OS-independent. We perform this check exclusively on the Linux runner to save CI time.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Build workspace
        run: cargo build --workspace --locked --all-features
        env:
          CARGO_BUILD_WARNINGS: ${{ runner.os == 'Windows' && 'warn' || 'deny' }}

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test portable release ZIP packaging policy
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./apps/desktop/scripts/release-portable-artifacts.test.ps1

      - name: Test Windows manifest selector and source contracts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $selectorTest = Join-Path $env:RUNNER_TEMP "renderpilot-windows-manifest-selector-tests.exe"
          rustc --edition=2024 --test apps/desktop/src-tauri/build-support/windows_manifest.rs -o $selectorTest
          if ($LASTEXITCODE -ne 0) {
            throw "Windows manifest selector test compilation failed with exit code $LASTEXITCODE."
          }
          & $selectorTest
          if ($LASTEXITCODE -ne 0) {
            throw "Windows manifest selector tests failed with exit code $LASTEXITCODE."
          }
          ./apps/desktop/scripts/verify-windows-manifest.test.ps1

      - name: Test release GitHub client behavior
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./apps/desktop/scripts/release-github-client.test.ps1

      - name: Run tests
        run: cargo test --workspace --all-features --locked --no-fail-fast
        # Cargo 1.97 promotes MSVC linker diagnostics through build.warnings;
        # Clippy above still denies Rust warnings for every test target.
        env:
          CARGO_BUILD_WARNINGS: ${{ runner.os == 'Windows' && 'warn' || 'deny' }}

      - name: Build docs
        if: runner.os == 'Linux'
        run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

  desktop:
    name: Desktop UI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: apps/desktop/package.json

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check documentation
        run: pnpm run docs:check

      - name: Check formatting (Oxfmt)
        run: pnpm run format:check

      - name: Lint (Oxlint + ESLint)
        run: pnpm run lint

      - name: Run tests (Vitest)
        run: pnpm test

      - name: Build (svelte-check + Vite)
        run: pnpm run build

  libraries-contract:
    name: Libraries V2 producer contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require an immutable producer ref
        shell: bash
        env:
          PRODUCER_REF: ${{ env.RENDERPILOT_LIBRARIES_CONTRACT_REF }}
        run: |
          if [[ ! "$PRODUCER_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::RENDERPILOT_LIBRARIES_CONTRACT_REF must be a full commit SHA"
            exit 1
          fi
      - name: Checkout RenderPilot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Checkout pinned catalog producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: osyka-yuri/renderpilot-libraries
          ref: ${{ env.RENDERPILOT_LIBRARIES_CONTRACT_REF }}
          path: .contracts/renderpilot-libraries
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Verify Luma and NVAPI localization sources
        working-directory: apps/desktop
        run: >-
          node scripts/check-external-source-contracts.mjs
          --producer-root "${{ github.workspace }}/.contracts/renderpilot-libraries"
      - name: Verify the shared V2 revision fixture
        shell: bash
        env:
          RENDERPILOT_LIBRARIES_FIXTURE: ${{ github.workspace }}/.contracts/renderpilot-libraries/scripts/test/fixtures/catalog-package-revision-v2.golden.json
        run: |
          set -o pipefail
          cargo test -p renderpilot-orchestration \
            libraries::revision::tests::producer_v2_golden_fixture_matches_rust_projection \
            --locked -- --ignored --exact 2>&1 | tee contract-test.log
          grep -Eq 'test result: ok\. 1 passed; 0 failed; 0 ignored' contract-test.log
