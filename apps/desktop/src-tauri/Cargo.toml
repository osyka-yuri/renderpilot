[package]
name = "renderpilot-desktop"
default-run = "renderpilot-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Tauri desktop shell for RenderPilot."
build = "build.rs"

[lints]
workspace = true

[build-dependencies]
json-patch = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
renderpilot-api = { workspace = true }
renderpilot-orchestration = { workspace = true }
getrandom = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
tracing = { workspace = true }
tracing-log = { workspace = true }
tracing-subscriber = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
semver = { workspace = true, optional = true }
sha2 = { workspace = true }
rusqlite = { workspace = true, features = ["backup", "bundled"], optional = true }
reqwest = { workspace = true, features = ["blocking", "rustls"], optional = true }
zip = { workspace = true, features = ["deflate"], optional = true }
tauri = { version = "2.11.6", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-shell = "2.3.6"
tauri-plugin-process = "2.3.1"

[target.'cfg(windows)'.dependencies]
base64 = { workspace = true, optional = true }
minisign-verify = { workspace = true, optional = true }
renderpilot-storage-sqlite = { workspace = true, optional = true }
webview2-com-sys = { workspace = true }
windows-core = { workspace = true }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "=2.4.4"

[features]
# Enables portable mode: data is stored in <exe_dir>/data instead of %LOCALAPPDATA%.
portable = [
    "dep:base64",
    "dep:minisign-verify",
    "dep:renderpilot-storage-sqlite",
    "dep:reqwest",
    "dep:rusqlite",
    "dep:semver",
    "dep:zip",
]
updater-artifact-verify = ["portable"]

[dev-dependencies]
json-patch = { workspace = true }
tempfile = { workspace = true }
log = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
renderpilot-storage-sqlite = { workspace = true, features = ["test-instrumentation"] }

[lib]
name = "renderpilot_desktop"
path = "src/lib.rs"

[[bin]]
name = "renderpilot-desktop"
path = "src/main.rs"

[[bin]]
name = "portable-supervisor"
path = "src/bin/portable_supervisor.rs"
required-features = ["portable"]

[[example]]
name = "verify_updater_signature"
required-features = ["updater-artifact-verify"]
