[package]
name = "renderpilot-desktop"
default-run = "renderpilot-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Tauri desktop shell for RenderPilot."
build = "build.rs"

[lints]
workspace = true

[build-dependencies]
json-patch = "4.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
renderpilot-api = { path = "../../../crates/renderpilot-api" }
renderpilot-orchestration = { path = "../../../crates/renderpilot-orchestration" }
env_logger = "0.11"
futures-util = "0.3"
getrandom = "0.4.3"
log = "0.4"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
semver = { version = "1.0.28", optional = true }
sha2 = { version = "0.11.0", optional = true }
rusqlite = { version = "0.40", features = ["backup", "bundled"], optional = true }
reqwest = { version = "0.13.4", features = ["blocking"], optional = true }
zip = { version = "8", default-features = false, features = ["deflate"], optional = true }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-shell = "2.3.5"
tauri-plugin-process = "2.3.1"

[target.'cfg(windows)'.dependencies]
base64 = { version = "0.23.1", optional = true, default-features = false, features = ["std"] }
minisign-verify = { version = "0.2.5", optional = true }
renderpilot-storage-sqlite = { path = "../../../crates/renderpilot-storage-sqlite", optional = true }
webview2-com-sys = "0.39.1"
winreg = "0.56"
windows-core = "0.62.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[features]
# Enables portable mode: data is stored in <exe_dir>/data instead of %LOCALAPPDATA%.
portable = [
    "dep:base64",
    "dep:minisign-verify",
    "dep:renderpilot-storage-sqlite",
    "dep:reqwest",
    "dep:rusqlite",
    "dep:semver",
    "dep:sha2",
    "dep:zip",
]
updater-artifact-verify = ["portable"]

[dev-dependencies]
json-patch = "4.2.0"

[lib]
name = "renderpilot_desktop"
path = "src/lib.rs"

[[bin]]
name = "renderpilot-desktop"
path = "src/main.rs"

[[bin]]
name = "portable-supervisor"
path = "src/bin/portable_supervisor.rs"
required-features = ["portable"]

[[example]]
name = "verify_updater_signature"
required-features = ["updater-artifact-verify"]
