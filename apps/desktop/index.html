<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RenderPilot</title>
    <style>
      #app[data-startup-skeleton] {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--background, #171717);
        color: var(--muted-foreground, #a3a3a3);
      }

      #app[data-startup-skeleton] [data-startup-spinner] {
        width: 1.25rem;
        height: 1.25rem;
        display: block;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 9999px;
        animation: renderpilot-startup-spin 0.8s linear infinite;
      }

      @keyframes renderpilot-startup-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div
      id="app"
      data-startup-skeleton
      aria-busy="true"
      role="status"
      aria-label="Loading RenderPilot"
    >
      <span data-startup-spinner aria-hidden="true"></span>
    </div>
    <script type="module" src="/ui/src/app/bootstrap.ts"></script>
  </body>
</html>
