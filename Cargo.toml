[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/renderpilot-domain",
    "crates/renderpilot-application",
    "crates/renderpilot-detection",
    "crates/renderpilot-storage-sqlite",
    "crates/renderpilot-platform-windows",
    "crates/renderpilot-nvapi",
    "crates/renderpilot-cli",
    "crates/renderpilot-orchestration",
    "crates/renderpilot-api",
]
resolver = "2"

[workspace.package]
version = "1.9.3"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-only"

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
# `deny` (not `forbid`) so FFI modules can `allow`/`expect(unsafe_code)` with a reason.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
redundant_clone = "warn"
unnecessary_to_owned = "warn"

# Keep cryptographic hashing optimized in development builds so safety and integrity
# checks on large game executables do not stall the desktop UI under `tauri dev`.
[profile.dev.package.sha2]
opt-level = 3

# Continuous integration profile: keep line tables for readable panic backtraces
# while eliminating heavy type/variable debuginfo to accelerate CI passes.
[profile.ci]
inherits = "test"
debug = "line-tables-only"

# Production release profile: optimize across workspace crates and strip symbols
# to produce compact, high-performance distributable binaries.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
