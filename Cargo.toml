[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/renderpilot-domain",
    "crates/renderpilot-application",
    "crates/renderpilot-detection",
    "crates/renderpilot-storage-sqlite",
    "crates/renderpilot-platform-windows",
    "crates/renderpilot-nvapi",
    "crates/renderpilot-cli",
    "crates/renderpilot-orchestration",
    "crates/renderpilot-api",
]
resolver = "2"

[workspace.package]
version = "1.13.1"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"

[workspace.dependencies]
renderpilot-api = { path = "crates/renderpilot-api" }
renderpilot-application = { path = "crates/renderpilot-application" }
renderpilot-detection = { path = "crates/renderpilot-detection" }
renderpilot-domain = { path = "crates/renderpilot-domain" }
renderpilot-nvapi = { path = "crates/renderpilot-nvapi" }
renderpilot-orchestration = { path = "crates/renderpilot-orchestration" }
renderpilot-platform-windows = { path = "crates/renderpilot-platform-windows" }
renderpilot-storage-sqlite = { path = "crates/renderpilot-storage-sqlite" }

base64 = { version = "0.23", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false }
getrandom = "0.4"
hex = { version = "0.4", default-features = false, features = ["alloc"] }
http = "1"
httpdate = "1"
jiff = { version = "0.2", default-features = false, features = ["std"] }
json-patch = "4.2.0"
libloading = "0.9"
log = "0.4"
minisign-verify = "0.3.0"
percent-encoding = "2.3"
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false }
rusqlite = "0.40"
rustix = { version = "1.1.5", default-features = false }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sevenz-rust2 = { version = "0.23.0", default-features = false }
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", default-features = false }
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "registry", "tracing-log"] }
ulid = "3"
# Keep the Windows/WebView2 crate family aligned with the versions used by
# Tauri/Wry to avoid duplicate bindings. Re-check `cargo tree -d` when upgrading Tauri.
webview2-com-sys = "0.38.2"
windows = { version = "0.61.3", default-features = false }
windows-core = "=0.61.2"
windows-sys = { version = "0.61.2", default-features = false }
winreg = "0.56"

# Intentionally aligned with Tauri's dependency graph to avoid duplicate majors.
# Re-check with `cargo tree -d` when updating Tauri.
zip = { version = "4", default-features = false }
zstd = { version = "0.14", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
# `deny` (not `forbid`) so FFI modules can `allow`/`expect(unsafe_code)` with a reason.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
assigning_clones = "warn"
borrow_as_ptr = "warn"
cast_ptr_alignment = "warn"
duration_suboptimal_units = "warn"
needless_pass_by_value = "warn"
no_effect_underscore_binding = "warn"
redundant_clone = "warn"
unnecessary_to_owned = "warn"

# Optimize non-workspace dependencies for interactive development builds;
# workspace crates remain at dev defaults.
[profile.dev.package."*"]
opt-level = 3

# Cargo's built-in test profile inherits `dev`. Keep test dependencies
# unoptimized so clean local and CI test builds do not pay the opt-level 3
# compilation cost.
[profile.test.package."*"]
opt-level = 0

# Continuous integration profile: keep line tables for readable panic backtraces
# while eliminating heavy type/variable debuginfo to accelerate CI passes.
[profile.ci]
inherits = "test"
debug = "line-tables-only"

# Production release profile: `s` everywhere except the computational leaf
# dependencies below and the proven hot workspace crate (`renderpilot-detection`).
[profile.release]
lto = "fat"
opt-level = "s"
codegen-units = 1
strip = true

# Hot leaf dependencies used by archive decoding, hashing, and parsing, plus
# the proven hot workspace crate (`renderpilot-detection`).
# opt-level does not propagate from a crate to its own dependencies, so each
# crate and its engines must be listed explicitly (e.g. `sevenz-rust2` and
# `lzma-rust2`). C-backed crates are unaffected and intentionally absent.
[profile.release.package]
renderpilot-detection = { opt-level = 3 }
sha2 = { opt-level = 3 }
digest = { opt-level = 3 }
block-buffer = { opt-level = 3 }
crypto-common = { opt-level = 3 }
serde_json = { opt-level = 3 }
serde = { opt-level = 3 }
serde_core = { opt-level = 3 }
zmij = { opt-level = 3 }
itoa = { opt-level = 3 }
regex = { opt-level = 3 }
regex-automata = { opt-level = 3 }
regex-syntax = { opt-level = 3 }
aho-corasick = { opt-level = 3 }
memchr = { opt-level = 3 }
flate2 = { opt-level = 3 }
miniz_oxide = { opt-level = 3 }
simd-adler32 = { opt-level = 3 }
zlib-rs = { opt-level = 3 }
zip = { opt-level = 3 }
crc32fast = { opt-level = 3 }
adler2 = { opt-level = 3 }
brotli = { opt-level = 3 }
brotli-decompressor = { opt-level = 3 }
quick-xml = { opt-level = 3 }
png = { opt-level = 3 }
hex = { opt-level = 3 }
time = { opt-level = 3 }
jiff = { opt-level = 3 }
jiff-core = { opt-level = 3 }
