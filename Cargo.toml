[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/renderpilot-domain",
    "crates/renderpilot-application",
    "crates/renderpilot-detection",
    "crates/renderpilot-storage-sqlite",
    "crates/renderpilot-platform-windows",
    "crates/renderpilot-nvapi",
    "crates/renderpilot-cli",
    "crates/renderpilot-orchestration",
    "crates/renderpilot-api",
]
resolver = "2"

[workspace.package]
version = "1.4.1"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-only"

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
# `deny` (not `forbid`) so FFI modules can `allow`/`expect(unsafe_code)` with a
# reason. Enforcement for non-FFI code: scripts/assert_unsafe_allowlist.mjs.
# Keep in sync with rust-toolchain.toml channel and CI assert_msrv expected version.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
redundant_clone = "warn"
unnecessary_to_owned = "warn"
