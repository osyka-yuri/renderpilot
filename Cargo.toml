[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/renderpilot-domain",
    "crates/renderpilot-application",
    "crates/renderpilot-detection",
    "crates/renderpilot-storage-sqlite",
    "crates/renderpilot-platform-windows",
    "crates/renderpilot-nvapi",
    "crates/renderpilot-cli",
    "crates/renderpilot-orchestration",
    "crates/renderpilot-api",
]
resolver = "2"

[workspace.package]
version = "1.10.3"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
# `deny` (not `forbid`) so FFI modules can `allow`/`expect(unsafe_code)` with a reason.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
redundant_clone = "warn"
unnecessary_to_owned = "warn"

# Continuous integration profile: keep line tables for readable panic backtraces
# while eliminating heavy type/variable debuginfo to accelerate CI passes.
[profile.ci]
inherits = "test"
debug = "line-tables-only"

# Production release profile: `s` everywhere except the computational leaf
# dependencies below and the proven hot workspace crate (`renderpilot-detection`).
[profile.release]
lto = "fat"
opt-level = "s"
codegen-units = 1
strip = true

# Hot leaf dependencies: opt-level does not propagate from a crate to its own
# dependencies, so each crate and its engines must be listed explicitly
# (e.g. `regex` and `regex-automata`). C-backed crates are unaffected by
# opt-level and are intentionally absent.
[profile.release.package.sha2]
opt-level = 3
[profile.release.package.serde_json]
opt-level = 3
[profile.release.package.serde]
opt-level = 3
[profile.release.package.serde_core]
opt-level = 3
[profile.release.package.zmij]
opt-level = 3
[profile.release.package.itoa]
opt-level = 3
[profile.release.package.regex]
opt-level = 3
[profile.release.package.regex-automata]
opt-level = 3
[profile.release.package.regex-syntax]
opt-level = 3
[profile.release.package.aho-corasick]
opt-level = 3
[profile.release.package.memchr]
opt-level = 3
[profile.release.package.miniz_oxide]
opt-level = 3
[profile.release.package.simd-adler32]
opt-level = 3
[profile.release.package.zlib-rs]
opt-level = 3
[profile.release.package.zip]
opt-level = 3
[profile.release.package.crc32fast]
opt-level = 3
[profile.release.package.adler2]
opt-level = 3
[profile.release.package.brotli]
opt-level = 3
[profile.release.package.brotli-decompressor]
opt-level = 3
[profile.release.package.quick-xml]
opt-level = 3
[profile.release.package.png]
opt-level = 3
[profile.release.package.hex]
opt-level = 3
[profile.release.package.time]
opt-level = 3
[profile.release.package.jiff]
opt-level = 3
[profile.release.package.jiff-core]
opt-level = 3

# Proven hot workspace crate: file hashing, directory traversal and filtering
# benefit significantly (+25% SHA-256 throughput, 2x cold catalog bootstrap)
# from opt-level 3 with negligible binary size overhead (+99 KB / +0.5%).
[profile.release.package.renderpilot-detection]
opt-level = 3
