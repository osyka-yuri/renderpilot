[package]
name = "renderpilot-orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Orchestration layer for RenderPilot — typed feature results and ServiceError."

[lints]
workspace = true

[features]
# Deliberately opt-in cooperative fallback for local development hosts other
# than the supported Windows and Linux production targets.
development-host-fallback = []

[dependencies]
renderpilot-application = { workspace = true }
renderpilot-detection = { workspace = true }
renderpilot-domain = { workspace = true }
renderpilot-nvapi = { workspace = true }
renderpilot-platform-windows = { workspace = true }
renderpilot-storage-sqlite = { workspace = true }
hex = { workspace = true }
futures-util = { workspace = true, features = ["alloc"] }
http = { workspace = true }
httpdate = { workspace = true }
tracing = { workspace = true }
percent-encoding = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "gzip", "json", "rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
sevenz-rust2 = { workspace = true, features = ["compress", "util"] }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync", "time"] }
ulid = { workspace = true }
zip = { workspace = true, features = ["deflate"] }
zstd = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_System_Threading", "Wdk_Storage_FileSystem"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
renderpilot-detection = { workspace = true, features = ["test-instrumentation"] }
renderpilot-storage-sqlite = { workspace = true, features = ["test-instrumentation"] }
rusqlite = { workspace = true, features = ["bundled"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lib]
path = "src/lib.rs"
