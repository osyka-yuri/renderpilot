[package]
name = "renderpilot-orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Orchestration layer for RenderPilot — typed feature results and ServiceError."

[lints]
workspace = true

[features]
# Deliberately opt-in cooperative fallback for local development hosts other
# than the supported Windows and Linux production targets.
development-host-fallback = []

[dependencies]
renderpilot-application = { path = "../renderpilot-application" }
renderpilot-detection = { path = "../renderpilot-detection" }
renderpilot-domain = { path = "../renderpilot-domain" }
renderpilot-nvapi = { path = "../renderpilot-nvapi" }
renderpilot-platform-windows = { path = "../renderpilot-platform-windows" }
renderpilot-storage-sqlite = { path = "../renderpilot-storage-sqlite" }
hex = "0.4"
filetime = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
http = "1"
httpdate = "1"
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "gzip", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "sync"] }
ulid = "3"
urlencoding = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }
zstd = { version = "0.13", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Wdk_Storage_FileSystem"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[dev-dependencies]
renderpilot-storage-sqlite = { path = "../renderpilot-storage-sqlite", features = ["test-instrumentation"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

[lib]
path = "src/lib.rs"
