[package]
name = "renderpilot-storage-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SQLite storage adapter boundary for RenderPilot."
build = "build.rs"

[lints]
workspace = true

[features]
test-instrumentation = []

[build-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[dependencies]
base64 = { workspace = true }
tracing = { workspace = true }
renderpilot-application = { workspace = true }
renderpilot-domain = { workspace = true }
rusqlite = { workspace = true, features = ["backup", "bundled", "hooks"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
renderpilot-detection = { workspace = true }
tempfile = { workspace = true }

[lib]
path = "src/lib.rs"
