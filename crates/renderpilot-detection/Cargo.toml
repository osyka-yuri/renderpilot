[package]
name = "renderpilot-detection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Detection pipeline boundary for RenderPilot."

[lints]
workspace = true

[features]
# Enables deterministic detector source injection only for dependent crate
# tests. Production detection always uses SystemFileObservationSource.
test-instrumentation = []

[dependencies]
hex = "0.4"
log = "0.4"
renderpilot-application = { path = "../renderpilot-application" }
renderpilot-domain = { path = "../renderpilot-domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }

[dev-dependencies]
tempfile = "3"

[lib]
path = "src/lib.rs"
