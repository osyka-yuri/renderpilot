[package]
name = "renderpilot-detection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Detection pipeline boundary for RenderPilot."

[lints]
workspace = true

[features]
# Enables deterministic detector source injection only for dependent crate
# tests. Production detection always uses SystemFileObservationSource.
test-instrumentation = []

[dependencies]
hex = { workspace = true }
tracing = { workspace = true }
renderpilot-application = { workspace = true }
renderpilot-domain = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }

[dev-dependencies]
tempfile = { workspace = true }

[lib]
path = "src/lib.rs"
